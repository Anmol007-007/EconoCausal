<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — EconoCausal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0fbff;
      color: #131d20;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 100, 129, 0.08);
      border: 1px solid #bec8ce;
      max-width: 440px;
      margin: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #eaf5f9;
      color: #006481;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      font-family: monospace;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      color: #006481;
    }
    p {
      color: #475053;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    button {
      background: #006481;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #007ea2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">DISCONNECTED</div>
    <h1>You are currently offline</h1>
    <p>
      EconoCausal requires an active network connection to sync with the EconML CausalForestDML cluster and SciPy MILP optimizer.
    </p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
